<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-labelledby="title">
  <title id="title">Developer focus</title>
  <rect width="900" height="64" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="20" fill="#c4b5fd" text-anchor="middle">
    <text x="450" y="39">Building practical software solutions<tspan fill="#818cf8"> ▍</tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.36;0.42;0.92;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="39" opacity="0">Python · Web Development · AI Systems<tspan fill="#818cf8"> ▍</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.46;0.88;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>