name: Metrics

on:
  # Runs every hour
  schedule:
    - cron: "0 * * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Also runs on every push to main/master
  push:
    branches: ["master", "main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          # ── Core ──────────────────────────────────────────
          token: ${{ secrets.METRICS_TOKEN }}
          user: hussainasadullah496-ux
          template: classic
          base: header, activity, community, repositories, metadata

          # ── Plugins ───────────────────────────────────────

          # Most used languages
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake,
            shell, gnuplot
          plugin_languages_analysis_timeout: 15

          # Recent activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all

          # Starred topics
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: mastered

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Following / followers community stats
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers, following

          # GitHub achievements
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 6

          # Lines of code changed
          plugin_lines: yes

          # ── Output ────────────────────────────────────────
          # File committed to the repo root — referenced in README.md
          filename: github-metrics.svg
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update metrics [skip ci]"
          output_action: commit
